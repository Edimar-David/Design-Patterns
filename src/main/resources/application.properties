spring.application.name=gerenciador-financeiro
server.port=8080

# --- PostgreSQL (sobrescreva por variáveis de ambiente) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST}/gerenciador_financeiro
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
# "update" cria/ajusta as tabelas automaticamente em desenvolvimento.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- CORS: origens permitidas, separadas por vírgula ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5501,http://localhost:5501}
